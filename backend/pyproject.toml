[project]
name = "evidence-based-ai-research-assistant"
version = "0.1.0"
description = "A local evidence-traceable technical research assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langgraph>=0.3,<2",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
